<mat-card>
  <mat-card-content class="page-title">
    Profile
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <p style="text-align: center;">Vous pouvez modifier des informations conçernant votre profile à partir du formulaire ci-dessous</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-card-content>
          <div fxLayout="column" fxLayoutAlign="space-around">
              <div class="pb-1">
                  <mat-form-field style="width: 100%">
                    <input matInput type="text" placeholder="Prénoms"
                     [formControl]="form.controls['firstname']">
                  </mat-form-field>
                  <small *ngIf="form.controls['firstname'].hasError('required') &&
                  form.controls['firstname'].touched" class="mat-text-warn">
                    Ce champs est requis.</small>
              </div>
              <div class="pb-1">
                <mat-form-field style="width: 100%">
                  <input matInput type="text" placeholder="Nom"
                   [formControl]="form.controls['lastname']">
                </mat-form-field>
                <small *ngIf="form.controls['lastname'].hasError('required') &&
                form.controls['lastname'].touched" class="mat-text-warn">
                  Ce champs est requis.</small>
              </div>
              <div class="pb-1">
                <mat-form-field style="width: 100%">
                  <input disabled matInput type="text" placeholder="Nom d'utilisateur"
                   [formControl]="form.controls['username']">
                </mat-form-field>
                <small *ngIf="form.controls['username'].hasError('required') &&
                form.controls['username'].touched" class="mat-text-warn">
                  Ce champs est requis.</small>
              </div>
              <div class="pb-1">
                <mat-form-field style="width: 100%">
                  <input disabled matInput type="text" placeholder="Rôle"
                   [formControl]="form.controls['role']">
                </mat-form-field>
                <small *ngIf="form.controls['role'].hasError('required') &&
                form.controls['role'].touched" class="mat-text-warn">
                  Ce champs est requis.</small>
              </div>
           </div>
        </mat-card-content>
        <mat-card-actions  >
            <div fxLayout="row wrap">
              <div fxFlex.gt-sm="10" fxFlex.gt-xs="100" fxFlex="100">
                <button *ngIf="!onModificate" (click)="activateModification()"
                  mat-raised-button color="primary" type="submit" class="organization-submit">
                   Modifier
                </button>
              </div>
              <div fxFlex.gt-sm="50" fxFlex.gt-xs="100" fxFlex="100"></div>
              <div *ngIf="onModificate"  fxFlex.gt-sm="40" fxFlex.gt-xs="100" fxFlex="100">
                <a  (click)="activateModification()" type="button" mat-raised-button class="" color="accent">
                  <mat-icon>clear</mat-icon> Annuler
                </a>
                <button
                mat-raised-button color="primary" type="submit"
                [disabled]="!form.valid || loading" class="organization-submit">
                  <mat-icon>done</mat-icon> Valider
                  <mat-progress-spinner
                    mode="indeterminate"
                    class="warn loading-circle"
                    *ngIf="loading"
                    [diameter]="25" [strokeWidth]="2">
                  </mat-progress-spinner>
                </button>
              </div>
            </div>
          </mat-card-actions>
    </form>            
  </mat-card-content>
</mat-card>
