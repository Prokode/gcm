<mat-card>
  <mat-card-content>
    <mat-form-field style="width: 100%" class="mb-1">
      <input matInput placeholder="Filtrer la liste par nom" required (keyup)='updateFilter($event)'>
    </mat-form-field>
  </mat-card-content>
</mat-card>

<mat-card>

  <mat-card-content>
    <div *ngIf="tarifs.length" fxLayout="row wrap" fxLayoutAlign="space-around start">
      <div *ngFor="let tarif of tarifs" class="tarif-container" fxFlex.gt-sm="50" fxFlex.gt-xs="50" fxFlex="50">
        <div class="tarif-block" >
          <div class="tarif-header">
            <b>{{tarif.console.name}}</b> 
          </div>
          <div class="tarif-content">
              <ngx-datatable
              class='material'
              [columnMode]="'force'"
              [headerHeight]="50"
              [footerHeight]="50"
              [rowHeight]="'auto'"
              [limit]="5"
              [rows]='tarif.tarifs'
              [loadingIndicator]="loading"
              [messages]="{emptyMessage: 'Pas de tarifs disponibles'}">
                <ngx-datatable-column [sortable]="false">
                  <ng-template let-column="column" ngx-datatable-header-template>
                    <strong >Heure</strong>
                  </ng-template>
                  <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.hour +'h '+ row.minute+'min'}}
                  </ng-template>
                </ngx-datatable-column>
                <ngx-datatable-column name="cost" [sortable]="false">
                    <ng-template let-column="column" ngx-datatable-header-template>
                      <strong >Coût</strong>
                    </ng-template>
                    <ng-template let-value="value" ngx-datatable-cell-template>
                      {{value}}
                    </ng-template>
                  </ngx-datatable-column>
                <ngx-datatable-column name="created_at" [sortable]="false">
                  <ng-template let-column="column" ngx-datatable-header-template>
                    <strong>Date de création</strong>
                  </ng-template>
                  <ng-template let-row="row" ngx-datatable-cell-template>
                    {{row.created_at | date: 'dd/MM/yyyy'}}
                  </ng-template>
                </ngx-datatable-column>
                <ngx-datatable-column name="ACTIONS" [sortable]="false" >
                  <ng-template ngx-datatable-header-template>
                    <strong>ACTIONS</strong>
                  </ng-template>
                  <ng-template ngx-datatable-cell-template let-row="row">
                    <button mat-icon-button
                            mat-button-sm
                            class="mr-1 mat-green"
                            matTooltip="EDITER"
                            [routerLink]="[row._id, 'edit']"
                            (click)="onTarifUpdate(row)">
                      <mat-icon>create</mat-icon>
                    </button>
                    <button mat-icon-button
                            mat-button-sm color="warn"
                            class="mr-1"
                            matTooltip="SUPPRIMER"
                            (click)="onTarifDelate(row)">
                      <mat-icon>delete</mat-icon>
                    </button>
                  </ng-template>
                </ngx-datatable-column>
              </ngx-datatable>
              <div style="margin-bottom: 3px; margin-left: 3px;">
                <a (click)="createTarif(tarif)" mat-raised-button color="primary" type="button">
                  Ajouter un tarif
                </a>
              </div>
          </div>
        </div>  
      </div>
    </div>
    <div *ngIf="!tarifs.length" fxLayout="row wrap" fxLayoutAlign="space-around start">
        <h1>Pas de tarifs disponible...</h1>
    </div>
  </mat-card-content>     

</mat-card>

<div class="pb-1">
    <button mat-fab class="mr-1 mat-mini-fab mat-red-grey-A100 refresh-elements-button"
     (click)="getTarifs()">
      <mat-icon>cached</mat-icon>
    </button>
  </div>
