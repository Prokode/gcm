<div class="session mat-indigo">
  <div class="session-content">
    <div class="session-wrapper">
      <mat-card>
        <mat-card-content>
          <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="text-xs-center pb-1">
              <!-- <h1 style="color: #3f51b5 !important; font-size: 2.7em;">GCM-DOT COM</h1> -->
              <img src="./assets/images/logo.JPG" alt="">
              <h3 style="text-align: center; ">{{society}}</h3>
              <p class="mat-text-muted">Connectez-vous pour continuer</p>
            </div>
            <div>
              <p *ngIf="showErrorMsg" style="color: red; text-align: center;">
               {{
                errorMsg
               }}
              </p>
            </div>
            <div fxLayout="column" fxLayoutAlign="space-around">
              <div class="pb-1">
                <mat-form-field style="width: 100%">
                  <input matInput placeholder="Nom d'utilisateur" 
                  [formControl]="form.controls['username']">
                </mat-form-field>
                <small *ngIf="form.controls['username'].hasError('required') &&
                 form.controls['username'].touched" class="mat-text-warn">Ce champs est requis</small>
              </div>
              <div class="pb-1">
                <mat-form-field style="width: 100%">
                  <input matInput type="password" placeholder="Mot de passe"
                   [formControl]="form.controls['password']">
                </mat-form-field>
                <small *ngIf="form.controls['password'].hasError('required') &&
                 form.controls['password'].touched" class="mat-text-warn">Ce champs est requis.</small>
              </div>
              <!-- <div class="pb-1">
                <mat-checkbox>Stay logged in</mat-checkbox>
              </div> -->
              <button mat-raised-button color="primary" type="submit" [disabled]="!form.valid">
                Connexion
                <mat-progress-spinner
                  style="color: white !important;"
                  mode="indeterminate"
                  class="white loading-circle"
                  *ngIf="loading"
                  [diameter]="25" [strokeWidth]="2">
                </mat-progress-spinner>
              </button>
            </div>
            <!-- <div class="pt-1 pb-1 text-xs-center">
              <a [routerLink]="['/session/forgot']">Forgot password?</a>&nbsp;&nbsp;&nbsp;&nbsp;
              <a [routerLink]="['/session/signup']">Sign up for a new account.</a>
            </div> -->
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
