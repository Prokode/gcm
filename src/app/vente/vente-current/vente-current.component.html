<mat-card>
    <mat-card-content>
      <div fxLayout="row wrap">
          <!-- <div fxFlex.gt-sm="5" fxFlex.gt-xs="100" fxFlex="5"></div> -->
            <div  class="poste-block" 
            *ngFor="let poste of postes"
             fxFlex.gt-sm="25" fxFlex.gt-xs="100" fxFlex="25">
             <h2 style="text-align: center;"><b>{{poste.poste.name}}</b></h2>
              <div class="television-container">
                  <div class="television">
                    <div fxLayout="row wrap" style="margin-top: 35px;">
                      <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100" 
                      style="text-align: center; padding-top: 5px;">
                        <h1  style="color:#f44336 !important; ">
                          <b *ngIf="!poste.time && !poste.tarif">READY !</b>
                          <b *ngIf="!poste.time && poste.tarif">{{poste.tarif.hour + ' : ' + poste.tarif.minute + ' : ' + '00' }} </b>
                          <b [ngClass]="{'end_signal': getEndSignal(poste)}" *ngIf="poste.time && poste.tarif">{{poste.time}}</b>
                        </h1>
                      </div>
                  </div>  
                  </div>
                  <div class="television-footer-vertical"></div>
                  <div class="television-footer-horizotal"></div>
              </div>
              <div  [ngClass]="{'console-red': ((!poste.time && !poste.tarif) || (!poste.time && poste.tarif)), 'console-green': (poste.time && poste.tarif) }" 
              class="console" >
                <b>{{poste.console.name}}</b>
              </div>
              <!-- <div fxLayout="row wrap">
                  <div fxFlex.gt-sm="100" fxFlex.gt-xs="100" fxFlex="100" style="text-align: center; padding-top: 5px;">
                    <h1  style="color:brown; ">
                      <b  *ngIf="!poste.time && !poste.tarif">{{'00 : 00 : 00'}} </b>
                      <b  *ngIf="poste.time && poste.tarif">{{poste.time}}</b>
                    </h1>
                  </div>
              </div>   -->
            </div>
      </div>
        
    </mat-card-content> 
  </mat-card>
