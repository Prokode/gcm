<div class="app mat-typography" [dir]="options.dir" [ngClass]="{'app-dark': options.dark, 'boxed': options.boxed, 'collapsed-sidebar': options.collapsed, 'compact-sidebar': options.compact, 'side-panel-opened': sidePanelOpened, 'side-panel-closed': !sidePanelOpened }">
  <ngx-loading-bar color="#009688"></ngx-loading-bar>
  <app-header [society]="society" (toggleSidenav)="sidemenu.toggle()" (toggleNotificationSidenav)="notifications.toggle()"></app-header>

  <mat-sidenav-container class="app-inner">
    
    <mat-sidenav [ngClass]="{'night-mode': night_mode}" #sidemenu class="sidebar-panel" id="sidebar-panel" [mode]="isOver() ? 'over' : 'side'" [opened]="!isOver()" (open)="sidePanelOpened = true"
    (close)="sidePanelOpened = false" (mouseover)="menuMouseOver()" (mouseout)="menuMouseOut()" [perfectScrollbar]="config" [disabled]="mediaMatcher.matches">
      <div style="width: 100%; height: 50px; background-color: #3f51b5; color: white;
       padding-top: 12px;">
       <div style="display: inline-block; width: 15%;"></div>
        <div style="display: inline-block; width: 20%;">
          <mat-icon style=" font-size: 2em;">person</mat-icon>
        </div>
        <div style="display: inline-block; width: 50%;">
          <p>
            {{user.firstname  +  ' ' + user.lastname}} <br>
            <!-- <b>{{user.username}}</b> -->
          </p>
        </div>
      </div>
      <app-sidebar (click)="updatePS()"></app-sidebar>
    </mat-sidenav>
    <mat-sidenav #notifications position="end" class="chat-panel" mode="over" opened="false">
      <app-notification></app-notification>
    </mat-sidenav>
    <div [ngClass]="{'night-mode': night_mode}" [perfectScrollbar]="config" [disabled]="mediaMatcher.matches">
      <router-outlet></router-outlet>
      <div style="position: fixed; bottom: 0px; height: 20px; width: 100%; background-color: #f5f6f9 !important;">
        <p style="text-align: left; padding-left: 10px;">
           Copyright © 2022, GC Manager tous droits réservés, Fait par <i style="color:brown;" class="fa fa-heart"></i>
           DOTCOM et TKSM(90 - 06 - 53 - 16 / 91 - 64 - 69 - 85)
        </p>
      </div>
    </div>
  </mat-sidenav-container>
  
  <app-stand-by [society]="society" [activateFor]="standByType" *ngIf="showRefreshSession"></app-stand-by>
  <!-- Demo Purposes Only -->
  <!-- <app-options (messageEvent)="receiveOptions($event)"></app-options> -->
  <!-- /Demo Purposes Only -->
</div>
