<!doctype html> 
<html class=no-js>
    <head> 
        <meta charset=utf-8>
        <title>GCM</title> 
        <meta name=description> <meta name=viewport content="width=device-width"> 
        <link rel=stylesheet href=asset/dist/css/bootstrap.css>
        <style>
            .poste-img {
                width: 100% !important;
                margin: 0 auto;
                box-sizing: border-box;
            }

            .console {
                width: 80% !important;
                height: 40px;
                margin: 0 auto;
                box-sizing: border-box;
                border-radius: 6%;
                text-align: center;
                color: white;
                padding-top: 8px;
                margin-bottom: 4px;
            }

            .console-red {
                background-color: #f77979 !important;
            }

            .console-green {
                background-color: #3fa044 !important;
            }

            .poste-block {
                margin-bottom: 20px;
            }

            .end_signal {
                animation: blinker 1s linear infinite;
                border: 2px red solid;
            }
            
            @keyframes blinker {
                50% {
                opacity: 0;
                }
            }

            .television {
            height: 120px !important;
            border: 3px black solid;
            border-radius: 5px;
            }  

            .television-container {
            width: auto;
            padding: 1px;
            margin-bottom: 3px;
            }

            .television-footer-vertical {
            width: 10px;
            height: 25px;
            margin: 0 auto;
            box-sizing: border-box;
            background-color: black;
            }

            .television-footer-horizotal {
            width: 140px;
            height: 5px;
            margin: 0 auto;
            box-sizing: border-box;
            background-color: black;
            border-radius: 25px;
            }

        </style>
    </head> 
    <body ng-app="app" ng-controller="HomeCtrl"> 
        <div ng-show="loading" style="text-align: center; padding-top: 100px;">
            <h1 style="color:brown;">
                CHARGEMENT...
            </h1>
        </div>
        <div ng-show="!loading">
            <div ng-show="!postes.length" style="text-align: center; padding-top: 100px;">
                <h1 style="color:rgb(39, 25, 25);">
                    PAS DE POSTES ACTIFS
                </h1>
            </div>
            <div ng-show="postes.length">
                <h1 style="text-align:  center; color: #3f51b5; text-decoration: underline;">
                    <b>
                        POSTES - GCM
                    </b>
                </h1>
                <br>
                <div class="container"> 
                    <div class="row">
                        <div ng-repeat="poste in postes" class="col-md-3" style="padding: 4px;">
                            <div>
                                <!--ng-class="{'end_signal': getEndSignal(poste)}" -->
                            <div >
                                <h4 style="text-align: center;"><b>{{poste.poste.name}}</b></h4>
                                    <div class="television-container">
                                        <div class="television">
                                            <div class="row">
                                                <div class="col-md-12" style="text-align: center; padding-top: 8px;">
                                                      <h1  style="color:#f44336;">
                                                        <b ng-show="!poste.time && !poste.tarif">READY !</b>
                                                        <b ng-show="!poste.time && poste.tarif">{{poste.tarif.hour + ' : ' + poste.tarif.minute + ' : ' + '00' }} </b>
                                                        <b ng-show="poste.time && poste.tarif">{{poste.time}}</b>
                                                      </h1>
                                                </div>
                                            </div> 
                                        </div>
                                        <div class="television-footer-vertical"></div>
                                        <div class="television-footer-horizotal"></div>
                                    </div>
                                    <div  ng-class="{'console-red': ((!poste.time && !poste.tarif) || (!poste.time && poste.tarif)),
                                    'console-green': (poste.time && poste.tarif)}"  class="console">
                                          <b>{{poste.console.name}}</b>
                                    </div>
                                    <!-- <div class="row">
                                        <div class="col-md-12" style="text-align: center; padding-top: 5px;">
                                              <h1  style="color:brown; ">
                                                <b ng-show="!poste.time && !poste.tarif">{{'00 : 00 : 00'}} </b>
                                                <b ng-show="poste.time && poste.tarif">{{poste.time}}</b>
                                              </h1>
                                        </div>
                                    </div>  -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src=asset/scripts/angular.min.js></script>
        <script src=asset/scripts/socket.io.js></script>
        <script src=asset/scripts/socket.min.js></script>
        <script src=asset/scripts/scripts.js></script>
        <script src=asset/scripts/controllers.js></script>
        <script src=asset/scripts/services.js></script>
        <script src=asset/scripts/HttpInterceptorFactory.js></script>
        <script src=asset/scripts/jquery-2.1.1.min.js></script>
        <script src=asset/dist/js/bootstrap.js></script>
    </body>
</html>
