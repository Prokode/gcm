<mat-card>
  <mat-card-content class="page-title">
    Sécurité
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content>
    <p style="text-align: center;">Vous pouvez modifier votre mot de passe à partir du formulaire ci-dessous</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-card-content>
          <div fxLayout="column" fxLayoutAlign="space-around">
              <div class="pb-1">
                  <mat-form-field style="width: 100%">
                    <input matInput type="password" placeholder="Mot de passe"
                     [formControl]="form.controls['oldPassword']">
                  </mat-form-field>
                  <small *ngIf="form.controls['oldPassword'].hasError('required') &&
                  form.controls['oldPassword'].touched" class="mat-text-warn">
                    Ce champs est requis.</small>
                </div>
                <div class="pb-1">
                  <mat-form-field style="width: 100%">
                    <input matInput type="password" placeholder="Mot de passe"
                     [formControl]="form.controls['password']">
                  </mat-form-field>
                  <small *ngIf="form.controls['password'].hasError('required') &&
                  form.controls['password'].touched" class="mat-text-warn">
                    Ce champs est requis.</small>
                    <small *ngIf="form.controls['password'].hasError('minlength') &&
                      form.controls['password'].touched" class="mat-text-warn">
                    Ce champs requière au minimum 8 caractères.</small>
                </div>
                <div class="pb-1">
                  <mat-form-field style="width: 100%">
                    <input matInput type="password" placeholder="Confirmer le mot de passe"
                      [formControl]="form.controls['passwordConfirm']">
                  </mat-form-field>
                  <small *ngIf="form.controls['passwordConfirm'].hasError('required') &&
                      form.controls['passwordConfirm'].touched" class="mat-text-warn">
                       Ce champs est requis.</small>
                    <small *ngIf="form.controls['passwordConfirm'].hasError('samePassword') &&
                      form.controls['passwordConfirm'].touched" class="mat-text-warn">
                    les 2 mots de passe ne sont pas identiques</small>
                </div>
           </div>
        </mat-card-content>
        <mat-card-actions  >
            <div fxLayout="row wrap">
              <div fxFlex.gt-sm="10" fxFlex.gt-xs="100" fxFlex="100">
                <button *ngIf="!onModificate" (click)="activateModification()"
                  mat-raised-button color="primary" type="submit" class="organization-submit">
                   Modifier
                </button>
              </div>
              <div fxFlex.gt-sm="50" fxFlex.gt-xs="100" fxFlex="100"></div>
              <div *ngIf="onModificate"  fxFlex.gt-sm="40" fxFlex.gt-xs="100" fxFlex="100">
                <a  (click)="activateModification()" type="button" mat-raised-button class="" color="accent">
                  <mat-icon>clear</mat-icon> Annuler
                </a>
                <button
                mat-raised-button color="primary" type="submit"
                [disabled]="!form.valid || loading" class="organization-submit">
                  <mat-icon>done</mat-icon> Valider
                  <mat-progress-spinner
                    mode="indeterminate"
                    class="warn loading-circle"
                    *ngIf="loading"
                    [diameter]="25" [strokeWidth]="2">
                  </mat-progress-spinner>
                </button>
              </div>
            </div>
          </mat-card-actions>
    </form>            
  </mat-card-content>
</mat-card>
