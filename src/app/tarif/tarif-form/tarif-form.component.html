<form [formGroup]="form" (ngSubmit)="submit()">
    <mat-card-content>
      <div fxLayout="column" fxLayoutAlign="space-around">
          <div class="pb-1">
              <mat-form-field style="width: 100%">
                  <mat-select placeholder="Console"
                              [formControl]="form.controls['console_id']">
                    <mat-option  *ngFor="let console of consoles" [value]="console._id"
                                 [matTooltip]="console.name">
                      {{console.name}} </mat-option>

                  </mat-select>
                  <mat-error *ngIf="form.controls['console_id'].hasError('required') &&
                   form.controls['console_id'].touched"
                             class="mat-text-warn">Ce champs est requis</mat-error>
              </mat-form-field>
          </div>

        <div class="pb-1">
            <mat-form-field style="width: 40% !important; display: inline-block !important;">
              <mat-select placeholder="Heure"
                              [formControl]="form.controls['hour']">
                    <mat-option  *ngFor="let hour of hours" [value]="hour"
                                 [matTooltip]="hour">
                      {{hour}} </mat-option>
              </mat-select>
            </mat-form-field>
            <mat-form-field style="width: 40% !important; display: inline-block !important;">
              <mat-select placeholder="Minutes"
                              [formControl]="form.controls['minute']">
                    <mat-option  *ngFor="let minute of minutes" [value]="minute"
                                 [matTooltip]="minute">
                      {{minute}} </mat-option>
              </mat-select>
            </mat-form-field>
        </div>

        <div class="pb-1">
            <mat-form-field style="width: 100%">
                <input matInput placeholder="Coût"
                 [formControl]="form.controls['cost']" type="number">
                <mat-error *ngIf="form.controls['cost'].hasError('required') &&
                 form.controls['cost'].touched"
                  class="mat-text-warn">Ce champs est requis</mat-error>
            </mat-form-field>
        </div>
      </div>
    </mat-card-content>
    <hr>
    <mat-card-actions  *ngIf="formstate === 'create' || formstate === 'edit'">
      <div fxLayout="row wrap">
        <div fxFlex.gt-sm="60" fxFlex.gt-xs="100" fxFlex="100"></div>
        <div fxFlex.gt-sm="40" fxFlex.gt-xs="100" fxFlex="100">
          <a  type="button" mat-raised-button class="" color="accent"
              [routerLink]="['/tairf']">
            <mat-icon>clear</mat-icon> Annuler
          </a>
          <button
          mat-raised-button color="primary" type="submit"
          [disabled]="!form.valid || loading" class="organization-submit">
            <mat-icon>done</mat-icon> Valider
            <mat-progress-spinner
              mode="indeterminate"
              class="warn loading-circle"
              *ngIf="loading"
              [diameter]="25" [strokeWidth]="2">
            </mat-progress-spinner>
          </button>
        </div>
      </div>
    </mat-card-actions>
</form>
