<div *ngIf="!posteactivation" class="poste-block">
  <div class="poste-block-content">
    <h2 style="color: #3f51b5 !important;" text-center><b>ACTIVATION POSTE</b></h2>
    <p text-center>Vous devez entrer votre code activation pour activer cette partie.</p>
    <app-poste-code-form [state]="'activation'" (onActivationSumitted)="onActivationSumitted($event)"  ></app-poste-code-form>
  </div>
</div>

<mat-card>
  <mat-card-content class="page-title">
    POSTES
  </mat-card-content>
</mat-card>

<mat-card>
  <mat-card-content style="text-align: right;">
    <mat-form-field style="width: 100%" class="mb-1">
      <input matInput placeholder="Filtrer la liste par numéro du poste ou numéro arduino pin" required (keyup)='updateFilter($event)'>
    </mat-form-field>
    <a [routerLink]="['code']" type="button" mat-raised-button  color="primary">Changer de code</a>
  </mat-card-content>
</mat-card>

<ngx-datatable
class='material'
[columnMode]="'force'"
[rowClass]="getRowClass"
[headerHeight]="50"
[footerHeight]="50"
[rowHeight]="'auto'"
[limit]="10"
[rows]='postes'
[loadingIndicator]="loading"
[messages]="{emptyMessage: 'Pas de données disponibles'}">
  <ngx-datatable-column name="name" [sortable]="false">
    <ng-template ngx-datatable-header-template>
      <strong >Nom</strong>
    </ng-template>
    <ng-template let-row="row" ngx-datatable-cell-template>
      {{row.poste.name}}
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column name=console [sortable]="false">
    <ng-template ngx-datatable-header-template>
      <strong >Console</strong>
    </ng-template>
    <ng-template let-row="row" ngx-datatable-cell-template>
      <span *ngIf="row.console">{{row.console.name}}</span>
      <span style="color: red; font-weight: bold;" *ngIf="!row.console">Non configuré</span>
    </ng-template>
  </ngx-datatable-column>
  <!-- <ngx-datatable-column name="arduino_pin" [sortable]="false">
    <ng-template ngx-datatable-header-template>
      <strong>Numéro pin</strong>
    </ng-template>
    <ng-template let-row="row"  ngx-datatable-cell-template>
      {{row.poste.arduino_pin}}
    </ng-template>
  </ngx-datatable-column> -->
  <ngx-datatable-column name="createdAt" [sortable]="false">
    <ng-template ngx-datatable-header-template>
      <strong>Date de création</strong>
    </ng-template>
    <ng-template let-row="row"  ngx-datatable-cell-template>
      {{row.poste.created_at | date: 'dd/MM/yyyy HH:MM:SS'}}
    </ng-template>
  </ngx-datatable-column>
  <ngx-datatable-column name="ACTIONS" [sortable]="false" >
    <ng-template ngx-datatable-header-template>
      <strong>ACTIONS</strong>
    </ng-template>
    <ng-template ngx-datatable-cell-template let-row="row">
      <button mat-icon-button
              mat-button-sm
              class="mr-1 mat-green"
              matTooltip="EDITER"
              style="color: white !important;"
              [routerLink]="[row.poste._id, 'edit']"
              >
        <mat-icon>create</mat-icon>
      </button>
      <button mat-icon-button
              mat-button-sm
              class="mr-1 mat-yellow"
              matTooltip="DETAILS"
              style="color: white !important;"
              [routerLink]="[row.poste._id, 'show']"
              >
        <mat-icon>remove_red_eye</mat-icon>
      </button>
      <button mat-icon-button
              mat-button-sm color="warn"
              class="mr-1"
              [matTooltip]="row.poste.wasDisable ? 'ACTIVER' :  'DESACTIVER'"
              (click)="onPosteDisable(row)">
        <mat-icon>delete</mat-icon>
      </button>
    </ng-template>
  </ngx-datatable-column>
</ngx-datatable>


<div *ngIf="posteactivation" class="pb-1">
    <button mat-fab class="mr-1 mat-mini-fab mat-blue-grey-A100 refresh-elements-button"
     (click)="getPostes()">
      <mat-icon>cached</mat-icon>
    </button>
  </div>

<div  *ngIf="posteactivation" class="pb-1 add-element-button-container">
    <button (click)="checkPosteLimitation()" mat-fab class="mr-1 mat-green add-element-button">
      <mat-icon>add</mat-icon>
    </button>
</div>
