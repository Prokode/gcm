<mat-card>
    <mat-card-title>
      <div class="report-title">
        <h1 >Rapport</h1>
      </div>
    </mat-card-title>
    <mat-card-content>
      <div class="report-content">
        <form (submit)="onSubmit()">
          <div class="report-item">
            <mat-form-field>
              <input 
                     matInput [matDatepicker]="FirstDatepicker" placeholder="Date Début" (click)="FirstDatepicker.open()">
              <mat-datepicker-toggle matSuffix [for]="FirstDatepicker"></mat-datepicker-toggle>
              <mat-datepicker #FirstDatepicker></mat-datepicker>
            </mat-form-field>
          </div>
          <div class="report-item">
            <mat-form-field>
              <input 
                     matInput [matDatepicker]="LastDatepicker" placeholder="Date Fin" (click)="LastDatepicker.open()">
              <mat-datepicker-toggle matSuffix [for]="LastDatepicker"></mat-datepicker-toggle>
              <mat-datepicker #LastDatepicker></mat-datepicker>
            </mat-form-field>
          </div>
