<!doctype html> 
<html class=no-js>
    <head> 
        <meta charset=utf-8>
        <title>GCM</title> 
        <meta name=description> <meta name=viewport content="width=device-width"> 
        <link rel=stylesheet href=asset/dist/css/bootstrap.css>
        <style>
            .poste-img {
                width: 100% !important;
                margin: 0 auto;
                box-sizing: border-box;
            }

            .console {
                width: 80% !important;
                height: 40px;
                margin: 0 auto;
                box-sizing: border-box;
                border-radius: 6%;
                text-align: center;
                color: white;
                padding-top: 8px;
                margin-bottom: 4px;
            }

            .console-red {
                background-color: #f77979 !important;
            }

            .console-green {
                background-color: #3fa044 !important;
            }

            .poste-block {
                margin-bottom: 20px;
            }

            .end_signal {
                animation: blinker 1s linear infinite;
                border: 2px red solid;
            }
            
            @keyframes blinker {
                50% {
                opacity: 0;
                }
            }

            .television {
            height: 120px !important;
            border: 3px black solid;
            border-radius: 5px;
            }  

            .television-container {
            width: auto;
            padding: 1px;
            margin-bottom: 3px;
            }

            .television-footer-vertical {
            width: 10px;
            height: 25px;
            margin: 0 auto;
            box-sizing: border-box;
            background-color: black;
            }

            .television-footer-horizotal {
            width: 140px;
            height: 5px;
            margin: 0 auto;
            box-sizing: border-box;
            background-color: black;
            border-radius: 25px;
            }

        </style>
        <link href="asset/dist/css/style.css" rel="stylesheet" type="text/css">
    </head> 
    <body ng-app="app"> 
      
        
        <div ng-view></div>

        <script src=asset/scripts/angular.min.js></script>
        <script src=asset/scripts/angular-route.js></script>
        <script src=asset/scripts/socket.io.js></script>
        <script src=asset/scripts/socket.min.js></script>
        <script src=asset/scripts/scripts.js></script>
        <script src=asset/scripts/controllers.js></script>
        <script src=asset/scripts/services.js></script>
        <script src=asset/scripts/HttpInterceptorFactory.js></script>
        <script src=asset/scripts/jquery-2.1.1.min.js></script>
        <script src=asset/dist/js/bootstrap.js></script>
        <script>
            $(function () {
                $('[data-toggle="popover"]').popover()
            })
        </script>
    </body>
</html>
